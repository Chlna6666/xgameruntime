[package]
name = "xgameruntime"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"
repository = "https://github.com/Chlna6666/xgameruntime"
description = "Rust xgameruntime.dll proxy and profile bridge for Minecraft Bedrock GDK"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
